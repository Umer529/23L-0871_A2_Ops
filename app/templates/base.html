<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VisionGuard{% endblock %} · VisionGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark" aria-hidden="true">◎</span> VisionGuard
    </a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint in ('index', 'predict') }}">Analyse</a>
      <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint == 'history' }}">History</a>
      <a href="{{ url_for('health') }}">Health</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    VisionGuard · 23L-0871_A2_Ops · AI-vs-real image classifier (MobileNetV2, TensorFlow/Keras)
  </footer>
</body>
</html>
