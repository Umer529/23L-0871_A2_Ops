# VisionGuard stack (Task 6.3):  docker compose up -d --build
# Secrets come from the untracked .env file next to this file (see .env.example).
name: visionguard

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-visionguard}
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume: data survives `down` / rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # no `ports:` on purpose - only reachable as db:5432 inside the Compose network

  web:
    build: .
    image: visionguard-web:latest
    environment:
      # "db" is the service name; Compose's internal DNS resolves it to the database container
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-visionguard}
      MODEL_PATH: /app/models/champion.keras
      THRESHOLD: ${THRESHOLD:-}
      INFERENCE_MODE: ${INFERENCE_MODE:-local}
      MODEL_API_URL: ${MODEL_API_URL:-}
      API_KEY: ${API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    volumes:
      - ./models:/app/models:ro              # champion model mounted read-only, not baked into the image
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy           # start only once Postgres accepts connections
    restart: unless-stopped

volumes:
  pgdata:
